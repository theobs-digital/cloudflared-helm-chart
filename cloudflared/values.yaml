replicaCount: 2

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  repository: cloudflare/cloudflared
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  enabled: true
  annotations: {}
  # Leave empty to derive a per-release name from the chart fullname.
  # A hardcoded name collides when several releases share a namespace.
  name: ""
  automountServiceAccountToken: false

podAnnotations: {}

opentelemetry:
  enabled: false
  
podLabels: {}

cloudflared:
  tunnelToken: ""
  existingSecret: ""
  # Extra environment variables for the cloudflared container. Every
  # `tunnel run` flag has a TUNNEL_* equivalent, listed at
  # https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/configure-tunnels/run-parameters/
  extraEnv: []
  # - name: TUNNEL_LOG_OUTPUT        # --output json, for log collectors
  #   value: json
  # - name: TUNNEL_EDGE_IP_VERSION   # IPv4-only clusters (default is auto)
  #   value: "4"

livenessProbe:
  tcpSocket:
    port: 2000
  initialDelaySeconds: 10
  periodSeconds: 20
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /ready
    port: 2000
  initialDelaySeconds: 5
  periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # Lets cloudflared open unprivileged ICMP sockets, so ping and traceroute
  # reach private networks behind the tunnel. The range must include
  # runAsGroup. Safe sysctl: allowed by the kubelet and by Pod Security
  # "restricted" without extra configuration. Set to [] to disable.
  sysctls:
    - name: net.ipv4.ping_group_range
      value: "65532 65532"

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 800m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Must exceed cloudflared's own --grace-period (30s by default,
# TUNNEL_GRACE_PERIOD): the kubelet sends SIGKILL when this expires, cutting
# requests that are still draining.
terminationGracePeriodSeconds: 45

networkPolicy:
  enabled: false
  allowedNamespaces: ["*"]
  additionalEgress: []
  # - to:
  #     - podSelector:
  #         matchLabels:
  #           app: backend
  #   ports:
  #     - protocol: TCP
  #       port: 8080

metrics:
  service:
    enabled: false
    port: 2000
  serviceMonitor:
    enabled: false
    interval: 30s
    additionalLabels: {}

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - cloudflared
          topologyKey: kubernetes.io/hostname
